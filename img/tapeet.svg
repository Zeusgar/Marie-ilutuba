<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <rect width="120" height="120" fill="#fbefec"/>
  <!-- triibud -->
  <rect x="0" width="2" height="120" fill="#f1d9d4"/>
  <rect x="60" width="2" height="120" fill="#f1d9d4"/>
  <!-- lill keskel -->
  <g transform="translate(30 30)" fill="#e5b8b1">
    <ellipse rx="5" ry="11" transform="rotate(0)"/>
    <ellipse rx="5" ry="11" transform="rotate(60)"/>
    <ellipse rx="5" ry="11" transform="rotate(120)"/>
    <circle r="4" fill="#d29a92"/>
  </g>
  <g transform="translate(90 90)" fill="#e5b8b1">
    <ellipse rx="5" ry="11" transform="rotate(0)"/>
    <ellipse rx="5" ry="11" transform="rotate(60)"/>
    <ellipse rx="5" ry="11" transform="rotate(120)"/>
    <circle r="4" fill="#d29a92"/>
  </g>
  <!-- lehed -->
  <g fill="#cfd8c4">
    <ellipse cx="90" cy="30" rx="3" ry="7" transform="rotate(35 90 30)"/>
    <ellipse cx="30" cy="90" rx="3" ry="7" transform="rotate(-35 30 90)"/>
  </g>
</svg>
